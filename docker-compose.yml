services:
  postgres:
    image: postgres:16-alpine
    container_name: lippaus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lippaus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lippaus}
      POSTGRES_DB: ${POSTGRES_DB:-lippaus}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lippaus}']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lippaus-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-lippaus}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-lippaus-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
